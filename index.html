<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#d4a574">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="澹伴煶鎵嬭处">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>澹伴煶鎵嬭处</title>
  <link rel="stylesheet" href="css/style.css?v=5j">
</head>
<body>
  <div id="app">
    <!-- ========== Header ========== -->
    <header class="app-header">
      <div class="header-content">
        <div class="header-brand">
          <span class="brand-icon">馃摂</span>
          <div>
            <h1>澹伴煶鎵嬭处 <span style="font-size:10px;color:#c4a882;font-weight:normal;">v5j</span></h1>
            <span id="entryCount" class="subtitle">0 绡囨墜璐?/span>
          </div>
        </div>
        <button id="settingsBtn" class="icon-btn" title="璁剧疆">鈿欙笍</button>
      </div>
    </header>

    <!-- ========== Entry List ========== -->
    <main class="main-content">
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">馃摉</div>
        <h2>寮€濮嬩綘鐨勭涓€椤垫墜璐?/h2>
        <p>鎷嶄竴寮犵収鐗囷紝璇翠竴娈佃瘽<br>AI 甯綘鍐欐垚娓╂殩鐨勬墜璐?/p>
      </div>
      <div id="entryList" class="entry-list"></div>
    </main>

    <!-- ========== FAB ========== -->
    <button id="fabBtn" class="fab" title="鏂板缓鎵嬭处">
      <span>+</span>
    </button>

    <!-- ========== New Entry Overlay ========== -->
    <div id="newEntryOverlay" class="overlay">
      <div class="overlay-header">
        <button id="closeNewEntryBtn" class="icon-btn">鉁?/button>
        <span class="overlay-title">鏂板缓鎵嬭处</span>
        <div class="header-spacer"></div>
      </div>

      <div class="overlay-body">
        <!-- Step 1: Photo -->
        <div id="stepPhoto" class="step">
          <div id="photoPlaceholder" class="photo-placeholder">
            <span class="placeholder-icon">馃摲</span>
            <p>鎷嶄竴寮犵収鐗囷紙鍙€夛級</p>
            <input type="file" id="photoInput" accept="image/*" capture="environment" class="photo-file-input">
            <button id="skipPhotoBtn" class="btn btn-outline skip-btn">璺宠繃锛岀洿鎺ヨ褰曟枃瀛?/button>
          </div>
          <div id="photoPreview" class="photo-preview hidden">
            <img id="photoPreviewImg" src="" alt="棰勮">
            <div class="photo-preview-actions">
              <button id="retakePhotoBtn" class="btn btn-outline">閲嶆媿</button>
              <button id="usePhotoBtn" class="btn btn-primary">浣跨敤杩欏紶鐓х墖</button>
            </div>
          </div>
        </div>

        <!-- Step 2: Record -->
        <div id="stepVoice" class="step hidden">
          <div id="photoThumbWrapper" class="photo-thumb hidden">
            <img id="photoThumb" src="" alt="">
          </div>
          <div class="voice-area">
            <p class="voice-prompt">鎸変綇璇磋瘽锛屾垨鐩存帴杈撳叆鏂囧瓧</p>
            <button id="recordBtn" class="record-btn">
              <span class="record-icon">馃帳</span>
              <span class="record-label">鎸変綇璇磋瘽</span>
            </button>
            <div id="transcriptDisplay" class="transcript-box"></div>
            <p id="recordHint" class="record-hint">璇磋瘽鍐呭浼氬疄鏃舵樉绀哄湪涓婃柟</p>
          </div>
          <div class="voice-fallback">
            <p class="fallback-label">馃摑 鎴栫洿鎺ヨ緭鍏ユ枃瀛楋細</p>
            <textarea id="manualTextInput" class="manual-input" placeholder="鍐欎笅浣犳兂璇寸殑璇?.."></textarea>
          </div>
          <button id="generateBtn" class="btn btn-primary btn-full" disabled>
            鉁?鐢熸垚鎵嬭处
          </button>
        </div>

        <!-- Step 3: Result -->
        <div id="stepResult" class="step hidden">
          <div id="resultLoading" class="result-loading">
            <div class="loading-animation">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <p>AI 姝ｅ湪涓轰綘涔﹀啓...</p>
          </div>
          <div id="resultError" class="result-error hidden">
            <span class="error-icon">馃槥</span>
            <p id="errorMessage"></p>
            <button id="retryGenerateBtn" class="btn btn-outline">閲嶈瘯</button>
          </div>
          <div id="resultContent" class="result-content hidden">
            <div class="journal-paper">
              <h2 id="resultTitle" class="journal-title"></h2>
              <p id="resultPoem" class="journal-poem"></p>
              <p id="resultJournal" class="journal-text"></p>
              <div class="journal-meta">
                <span id="resultMood"></span>
                <div id="resultTags" class="journal-tags"></div>
              </div>
            </div>
            <div class="result-actions">
              <button id="discardJournalBtn" class="btn btn-outline">涓㈠純</button>
              <button id="regenerateBtn" class="btn btn-outline">馃攧 鎹竴涓?/button>
              <button id="saveJournalBtn" class="btn btn-primary">馃捑 淇濆瓨</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Detail Modal ========== -->
    <div id="detailModal" class="overlay detail-overlay">
      <div class="overlay-header">
        <button id="closeDetailBtn" class="icon-btn">鉁?/button>
        <span class="overlay-title">鎵嬭处璇︽儏</span>
        <div class="header-spacer"></div>
      </div>
      <div class="detail-body">
        <div id="detailPhoto" class="detail-photo">
          <label id="editPhotoLabel" class="edit-photo-label hidden">
            <input type="file" id="editPhotoInput" accept="image/*" hidden>
            馃摲 鏇存崲鐓х墖
          </label>
        </div>
        <div class="detail-paper">
          <div class="detail-meta">
            <span id="detailDate"></span>
            <span id="detailMood"></span>
          </div>
          <h2 id="detailTitle" class="detail-title"></h2>
          <input id="editTitle" class="edit-input hidden" placeholder="鎵嬭处鏍囬">
          <p id="detailPoem" class="detail-poem"></p>
          <p id="detailJournal" class="detail-text"></p>
          <textarea id="editJournal" class="edit-textarea hidden" placeholder="鎵嬭处姝ｆ枃"></textarea>
          <div id="detailTags" class="detail-tags"></div>
          <div class="detail-transcript">
            <h4>馃帣锔?浣犵殑鍘熻瘽</h4>
            <p id="detailTranscript"></p>
          </div>
          <div id="detailActionsView" class="detail-actions">
            <button id="editEntryBtn" class="btn btn-outline btn-full">鉁忥笍 缂栬緫</button>
            <button id="deleteEntryBtn" class="btn btn-danger btn-full">馃棏锔?鍒犻櫎</button>
          </div>
          <div id="detailActionsEdit" class="detail-actions hidden">
            <button id="cancelEditBtn" class="btn btn-outline">鍙栨秷</button>
            <button id="saveEditBtn" class="btn btn-primary">馃捑 淇濆瓨淇敼</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Settings Overlay ========== -->
    <div id="settingsOverlay" class="overlay">
      <div class="overlay-header">
        <button id="closeSettingsBtn" class="icon-btn">鉁?/button>
        <span class="overlay-title">璁剧疆</span>
        <div class="header-spacer"></div>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <label for="providerSelect">AI 鏈嶅姟鍟?/label>
          <select id="providerSelect" class="settings-select">
            <option value="zhipu">鏅鸿氨 GLM-4V锛堟帹鑽愶紝鍥藉唴鍙敤锛?/option>
            <option value="qwen">閫氫箟鍗冮棶 Qwen-VL</option>
            <option value="gemini">Gemini 1.5 Flash锛堥渶缈诲锛?/option>
          </select>
        </div>
        <p class="settings-hint" style="color:#8b7355;text-align:center;padding:12px;background:#fef9f0;border-radius:8px;">榛樿 AI 宸查厤缃ソ锛岀洿鎺ヤ娇鐢ㄥ嵆鍙?br>濡傞渶鐢ㄨ嚜宸辩殑 Key锛岀偣涓嬫柟鎸夐挳璁剧疆</p>
        <button id="useCustomKeyBtn" class="btn btn-outline btn-full" style="font-size:13px;">浣跨敤鑷繁鐨?API Key</button>
        <div id="customKeySection" class="hidden">
          <div class="settings-section">
            <label for="apiKeyInput">API Key</label>
            <input type="password" id="apiKeyInput" placeholder="杈撳叆浣犵殑 API Key">
          </div>
          <button id="saveSettingsBtn" class="btn btn-primary btn-full">淇濆瓨鑷畾涔?Key</button>
          <button id="useDefaultKeyBtn" class="btn btn-outline btn-full" style="font-size:13px;">鎭㈠榛樿 Key</button>
        </div>
        <p class="privacy-note">鏁版嵁浠呬繚瀛樺湪鎵嬫満鏈湴锛屼笉涓婁紶浠讳綍鏈嶅姟鍣?/p>
      </div>
    </div>
  </div>

  <script src="js/storage.js?v=5j"></script>
  <script src="js/ai.js?v=5j"></script>
  <script src="js/app.js?v=5j"></script>
</body>
</html>
