<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#d4a574">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅行手帐">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>旅行手帐</title>
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="logo">📔</span>
        <div>
          <h1>旅行手帐</h1>
          <span id="countBadge" class="badge">0 篇</span>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn">⚙️</button>
    </header>

    <!-- Search -->
    <div id="searchBox" class="search-box">
      <span class="search-icon">🔍</span>
      <input id="searchInput" class="search-input" placeholder="搜索手帐..." autocomplete="off">
      <button id="clearSearchBtn" class="search-clear hidden">✕</button>
    </div>

    <!-- Entry List -->
    <main id="mainContent" class="main">
      <div id="emptyHint" class="empty">
        <div class="empty-icon">📖</div>
        <h2>开始你的第一页手账</h2>
        <p>拍一张照片，说一段话<br>AI 帮你写成温暖的手账</p>
      </div>
      <div id="entryList"></div>
    </main>

    <!-- FAB -->
    <button id="fab" class="fab">+</button>

    <!-- ====== New Entry Overlay ====== -->
    <div id="newOverlay" class="overlay">
      <div class="overlay-top">
        <button id="closeNewBtn" class="icon-btn">✕</button>
        <span>新建手账</span>
        <span class="spacer"></span>
      </div>
      <div class="overlay-scroll">

        <!-- photo step -->
        <div id="photoStep" class="step-content">
          <div class="photo-pick">
            <span class="big-icon">📷</span>
            <p>拍一张照片（可选）</p>
            <button id="cameraBtn" class="btn-primary btn-block" style="max-width:280px;margin:12px auto;">📷 拍照</button>
            <div class="file-wrap">
              <span class="file-label file-label-outline">🖼️ 从相册选择</span>
              <input type="file" accept="image/*" class="file-overlay" onchange="App.gotPhoto(event)">
            </div>
            <button id="skipPhotoBtn" class="btn-text">跳过，直接记录文字</button>
          </div>
          <!-- Camera viewfinder -->
          <div id="cameraView" class="camera-wrap hidden">
            <video id="camVideo" autoplay playsinline></video>
            <div class="camera-actions">
              <button id="camCancelBtn" class="btn-outline">取消</button>
              <button id="camSnapBtn" class="snap-btn">📸</button>
              <span class="cam-spacer"></span>
            </div>
          </div>
          <div id="photoPreviewBox" class="photo-preview-box hidden">
            <img id="previewImg" src="" alt="">
            <div class="row-btns">
              <button id="retakeBtn" class="btn-outline flex-1">重拍</button>
              <button id="usePhotoBtn" class="btn-primary flex-1">使用这张照片</button>
            </div>
          </div>
        </div>

        <!-- voice step -->
        <div id="voiceStep" class="step-content hidden">
          <div id="miniPhoto" class="mini-photo hidden">
            <img id="miniPhotoImg" src="" alt="">
          </div>
          <div class="voice-area">
            <p class="hint">按住说话，或直接输入文字</p>
            <button id="recordBtn" class="mic-btn">
              <span class="mic-icon">🎤</span>
              <span class="mic-text">按住说话</span>
            </button>
            <div id="transcriptBox" class="transcript"></div>
            <p id="micHint" class="hint-small">说话内容会实时显示在上方</p>
          </div>
          <div class="text-fallback">
            <p>📝 或直接输入文字：</p>
            <textarea id="textInput" class="text-input" placeholder="写下你想说的话..."></textarea>
          </div>
          <div class="row-btns">
            <button id="aiGenBtn" class="btn-outline flex-1" disabled>🤖 AI生成文案</button>
            <button id="directSaveBtn" class="btn-primary flex-1" disabled>📝 录入文案</button>
          </div>
        </div>

        <!-- result step -->
        <div id="resultStep" class="step-content hidden">
          <div id="loadingBox" class="center-box">
            <div class="dots"><span></span><span></span><span></span></div>
            <p>AI 正在为你书写...</p>
          </div>
          <div id="errorBox" class="center-box hidden">
            <p class="err-icon">😞</p>
            <p id="errMsg" class="err-text"></p>
            <button id="retryBtn" class="btn-outline">重试</button>
          </div>
          <div id="resultBox" class="hidden">
            <div class="paper">
              <h2 id="resTitle" class="paper-title"></h2>
              <p id="resPoem" class="paper-poem"></p>
              <p id="resJournal" class="paper-body"></p>
              <div class="paper-meta">
                <span id="resMood"></span>
                <div id="resTags" class="tags"></div>
              </div>
            </div>
            <div class="row-btns">
              <button id="discardBtn" class="btn-outline">📝 使用录入文案</button>
              <button id="regenBtn" class="btn-outline">🔄 换一个</button>
              <button id="saveBtn" class="btn-primary flex-2">💾 保存</button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- ====== Detail Overlay ====== -->
    <div id="detailOverlay" class="overlay">
      <div class="overlay-top">
        <button id="closeDetailBtn" class="icon-btn">✕</button>
        <span>手账详情</span>
        <span class="spacer"></span>
      </div>
      <div class="overlay-scroll">
        <div id="detailPhoto" class="detail-photo">
          <label id="editPhotoBtn" class="edit-photo-btn hidden">
            <input type="file" id="editPhotoInput" accept="image/*" hidden onchange="App.editPhoto(event)">
            📷 更换照片
          </label>
        </div>
        <div class="detail-card">
          <div class="detail-meta">
            <span id="detailDate"></span>
            <span id="detailMood"></span>
          </div>
          <h2 id="detailTitle" class="detail-title"></h2>
          <input id="editTitleInput" class="edit-input hidden" placeholder="标题">
          <p id="detailPoem" class="detail-poem"></p>
          <p id="detailBody" class="detail-body"></p>
          <textarea id="editBodyInput" class="edit-textarea hidden" placeholder="正文"></textarea>
          <div id="detailTags" class="tags"></div>
          <div class="detail-transcript">
            <h4>🎙️ 你的原话</h4>
            <p id="detailTranscript"></p>
          </div>
          <div id="viewActions" class="row-btns">
            <button id="editBtn" class="btn-outline flex-1">✏️ 编辑</button>
            <button id="deleteBtn" class="btn-danger flex-1">🗑️ 删除</button>
          </div>
          <div id="editActions" class="row-btns hidden">
            <button id="cancelEditBtn" class="btn-outline flex-1">取消</button>
            <button id="saveEditBtn" class="btn-primary flex-1">💾 保存修改</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ====== Settings Overlay ====== -->
    <div id="settingsOverlay" class="overlay">
      <div class="overlay-top">
        <button id="closeSettingsBtn" class="icon-btn">✕</button>
        <span>设置</span>
        <span class="spacer"></span>
      </div>
      <div class="overlay-scroll">
        <div class="settings-body">
          <div class="setting-row">
            <label>AI 服务商</label>
            <select id="providerSelect" class="setting-select">
              <option value="zhipu">智谱 GLM-4-Flash（推荐）</option>
              <option value="qwen">通义千问 Qwen-VL</option>
              <option value="gemini">Gemini 1.5 Flash</option>
            </select>
          </div>
          <p class="info-box">请先设置 API Key 才能使用 AI 功能。<br>支持智谱、Gemini、通义千问。</p>
          <button id="showCustomKeyBtn" class="btn-outline btn-block" style="display:none">使用自己的 API Key</button>
          <div id="customKeyBox">
            <div class="setting-row">
              <label>API Key</label>
              <input type="password" id="apiKeyInput" class="setting-input" placeholder="输入你的 API Key">
            </div>
            <button id="saveKeyBtn" class="btn-primary btn-block">保存 Key</button>
            <button id="resetKeyBtn" class="btn-text" style="display:none">恢复默认 Key</button>
          </div>
          <p class="privacy">数据仅保存在手机本地，不上传任何服务器</p>
        </div>
      </div>
    </div>
    <span id="versionTag" class="version-tag">v1.0</span>
  </div>

  <script src="js/storage.js?v=13"></script>
  <script src="js/ai.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
